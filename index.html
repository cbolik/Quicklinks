<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0d0d" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Quicklinks</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/links.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="page-header hidden">
    <p class="label"></p>
    <div class="page-header-dots"></div>
    <button class="menu-btn" aria-label="More options">&#8942;</button>
    <div class="menu-dropdown hidden">
      <button class="menu-item" data-action="edit">Edit</button>
      <button class="menu-item" data-action="pages">Pages</button>
      <button class="menu-item" data-action="export">Export</button>
      <button class="menu-item" data-action="import">Import</button>
      <button class="menu-item" data-action="about">About</button>
    </div>
  </div>

  <main class="carousel"></main>

  <div class="indicators">
    <button class="arrow arrow-left" aria-label="Previous page">&#8249;</button>
    <button class="arrow arrow-right" aria-label="Next page">&#8250;</button>
  </div>

  <button class="fab" aria-label="Add link">+</button>

  <input type="file" id="import-file" accept=".json" class="hidden" />

  <div class="dialog-backdrop hidden">
    <div class="dialog">
      <h2 class="dialog-title">Add Link</h2>
      <form id="add-link-form">
        <div class="form-group">
          <label for="link-name">Name</label>
          <input type="text" id="link-name" placeholder="e.g. Current Tracks" required />
        </div>
        <div class="form-group">
          <label for="link-url">Link</label>
          <input type="text" id="link-url" placeholder="e.g. https://open.spotify.com/..." required />
          <p class="form-hint hidden" id="url-hint"></p>
        </div>
        <div class="form-group">
          <label for="link-category">Page</label>
          <input type="text" id="link-category" list="category-list" placeholder="e.g. Playlists" required />
          <datalist id="category-list"></datalist>
        </div>
        <div class="dialog-buttons">
          <button type="button" class="btn-cancel">Cancel</button>
          <button type="submit" class="btn-add">Add Link</button>
        </div>
      </form>
    </div>
  </div>

  <div class="pages-backdrop hidden">
    <div class="pages-editor">
      <div class="pages-header">
        <h2 class="pages-title">Pages</h2>
        <button class="pages-done-btn">Done</button>
      </div>
      <div class="pages-list"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
